services:
  - type: web
    name: msme-hub-employee-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MSME_SECRET_KEY
        generateValue: true
      - key: MSME_ALLOWED_ORIGINS
        value: https://msme-app-ignv75tsx32ds4bqvsvsz3.streamlit.app
      - key: DATABASE_URL
        sync: false
      - key: MSME_R2_ACCOUNT_ID
        sync: false
      - key: MSME_R2_ACCESS_KEY_ID
        sync: false
      - key: MSME_R2_SECRET_ACCESS_KEY
        sync: false
      - key: MSME_R2_BUCKET_NAME
        sync: false
      - key: MSME_PLATFORM_OWNER_EMAIL
        sync: false
      - key: MSME_PLATFORM_OWNER_PASSWORD
        sync: false
      - key: MSME_PLATFORM_OWNER_PASSWORD_HASH
        sync: false
